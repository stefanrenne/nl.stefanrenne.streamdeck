name: Continuous Integration
on:
  push:
    branches:
      - main
      - develop

jobs:
  build:
    name: Validate Homey App
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm test
      - uses: athombv/github-action-homey-app-validate@master
        with:
          level: verified
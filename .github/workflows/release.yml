name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        type: choice
        description: Version
        required: true
        default: patch
        options:
          - major
          - minor
          - patch
      changelog:
        type: string
        description: Changelog
        required: true

# Needed in order to push the commit and create a release
permissions:
  contents: write

jobs:
  main:
    name: Update Homey App Version
    runs-on: ubuntu-latest
    steps:
      # RELEASE_TOKEN: a fine-grained token of the repo owner (Contents: read and write). The owner's
      # admin role may bypass the develop ruleset (pull request and signed commits required);
      # GITHUB_TOKEN may not, and GitHub Actions cannot be added to the bypass list of a personal repo.
      - name: Check RELEASE_TOKEN
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::Secret RELEASE_TOKEN is not set: a fine-grained token of the repo owner with Contents read and write"
            exit 1
          fi
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/checkout@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm install
      - run: npm run lint
      - run: npm test
      - name: Update Homey App Version
        uses: athombv/github-action-homey-app-version@master
        id: update_app_version
        with:
          version: ${{ inputs.version }}
          changelog: ${{ inputs.changelog }}
      # package.json isn't read by Homey, but test/manifest.test.mts requires it to match the app version.
      - name: Sync package.json version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version
        env:
          VERSION: ${{ steps.update_app_version.outputs.version }}
      # Pushes with RELEASE_TOKEN (see checkout above).
      - name: Commit & Push
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" > /dev/null; then
            echo "::error::Tag v$VERSION already exists on GitHub"
            exit 1
          fi

          git add -A
          git commit -m "Update Homey App Version to v$VERSION"

          # The branch first: a refused push must not leave the tag on a commit that is on no branch.
          git push origin "HEAD:$GITHUB_REF_NAME"
          git tag "v$VERSION"
          git push origin "v$VERSION"

          # A draft release for this version (notes written by hand) is published as it is.
          if [ "$(gh release view "v$VERSION" --json isDraft -q .isDraft 2>/dev/null)" = "true" ]; then
            gh release edit "v$VERSION" --tag "v$VERSION" --draft=false --latest
          else
            gh release create "v$VERSION" -t "v$VERSION" --notes "$CHANGELOG" --generate-notes
          fi
        env:
          VERSION: ${{ steps.update_app_version.outputs.version }}
          CHANGELOG: ${{ inputs.changelog }}
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
      - name: Publish Homey App
        uses: athombv/github-action-homey-app-publish@master
        id: publish
        with:
          personal_access_token: ${{ secrets.HOMEY_PAT }}
      - name: URL
        run: |
          echo "Manage your app at ${{ steps.publish.outputs.url }}." >> $GITHUB_STEP_SUMMARY
